<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Inert XSS example</title>
  <desc id="desc">An XSS-like script shown as text only; it does not execute.</desc>
  <rect width="760" height="220" rx="18" fill="#101827"/>
  <text x="32" y="58" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">XSS example — displayed as inert text</text>
  <text x="32" y="112" fill="#93c5fd" font-family="monospace" font-size="20">&lt;script&gt;alert('XSS')&lt;/script&gt;</text>
  <text x="32" y="164" fill="#cbd5e1" font-family="sans-serif" font-size="16">This SVG contains no executable script.</text>
</svg>
